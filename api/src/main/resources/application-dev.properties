# 開発時だけ有効になる設定（spring.profiles.active=dev）
# 本番では読み込まれないので、ここに重いログを置いても問題ない。

# 実行された SQL とバインドされた値を見る。
# ⚠️ 値にはメールアドレスなどが出るため、本番では絶対に有効にしない
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.properties.hibernate.format_sql=true

# Flyway がどのマイグレーションを流したか見えるようにする
logging.level.org.flywaydb=debug

# 開発用の署名鍵。⚠️ 本物の秘密ではない（ローカルの偽データを守るだけ）。
# 本番の Railway では必ず環境変数 JWT_SECRET を設定すること。
# HS256 は256bit以上が必要なので、32文字以上にしてある。
mimamori.jwt.secret=dev-only-secret-do-not-use-in-production-32chars
