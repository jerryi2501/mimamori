spring.application.name=api

# 既定は dev。Railway では SPRING_PROFILES_ACTIVE=prod を設定する
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== DataSource =====
# 値はすべて環境変数で上書きできる。既定値はローカル開発用。
# ⚠️ 本番の接続情報を、このファイルに直接書かないこと。
#
# ⚠️ Railway が用意する DATABASE_URL は
#      postgresql://user:pass@host:port/db
#    という形式で JDBC URL ではない。そのままでは使えないので、
#    Railway 側で DB_URL / DB_USERNAME / DB_PASSWORD を個別に設定する。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mimamori}
spring.datasource.username=${DB_USERNAME:mimamori}
spring.datasource.password=${DB_PASSWORD:mimamori}

# ===== JPA / Hibernate =====
# ⚠️ スキーマは Flyway が管理する。Hibernate には作らせない。
#    validate = 起動時にエンティティとテーブルの不一致を検出して起動を止める。
#    update にすると列の追加しかできず、削除も型変更もできないまま
#    本番のスキーマが少しずつ壊れていく。
spring.jpa.hibernate.ddl-auto=validate

# 既定は true だが、DBコネクションを画面の描画完了まで握り続けてしまう。
# 接続数が足りなくなる典型的な原因なので明示的に切る。
spring.jpa.open-in-view=false

# 日時は必ず UTC で保存し、表示側で現地時間に直す
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Server =====
# Railway は PORT を注入してくる
server.port=${PORT:8080}

# ===== Actuator =====
# Railway のヘルスチェックに使う。health 以外は公開しない
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ===== JWT（F-10）=====
# ⚠️ 既定値を置かない。未設定なら起動時に落とす（JwtProperties で検証）。
#    「動くけど誰でも偽造できる」状態で本番に出るほうが危険なため。
mimamori.jwt.secret=${JWT_SECRET:}
# 有効期限。位置情報を扱うので長くしない。再発行(refresh)は今回は作らない
mimamori.jwt.expiration=${JWT_EXPIRATION:PT24H}

# ===== CORS =====
# Vercel からの呼び出しを許可する。Railway では実際のURLを設定する
mimamori.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
