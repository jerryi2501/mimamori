<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimamori — SC-M01 時間連動テーマ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   Mimamori — SC-M01 地図（ホーム）/ 時間連動テーマ
   ライト（昼）⇄ ダーク（夜）を実時刻で自動切替
   参考: ダークUIミニマル（BMWルートビューア風）+ iSharing の構造
   =================================================================== */

/* ============ ☀️ ライト（昼 5:00–18:00） ============ */
:root{
  --brand:#2F6BFF; --brand-soft:#EBF1FF;
  --online:#22C55E; --warn:#F59E0B; --danger:#EF4444; --offline:#9CA3AF;

  --surface:#FFFFFF; --surface-2:#F3F4F6;
  --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.12);
  --text:#1A1D26; --text-sub:#6B7280; --text-mute:#9CA3AF;

  --fab-bg:#FFFFFF; --fab-ic:#1A1D26;
  --cta-bg:#1A1D26; --cta-tx:#FFFFFF;
  --pin-ring:#FFFFFF;

  /* 地図 */
  --map-bg:#F2F2F0; --map-road:#FFFFFF; --map-water:#CBDDEC;
  --map-park:#E3EBDA; --map-bld:#E8E8E5; --map-label:#A8ADB5;

  --shadow-float:0 2px 8px rgba(0,0,0,.12);
  --shadow-sheet:0 -4px 20px rgba(0,0,0,.10);
  --shadow-pin:0 3px 8px rgba(0,0,0,.25);
  --font:'Noto Sans JP',-apple-system,sans-serif;
}

/* ============ 🌙 ダーク（夜 18:00–5:00） ============ */
[data-theme="dark"]{
  --brand:#4D9FFF; --brand-soft:rgba(77,159,255,.14);
  --online:#34D97A; --warn:#FBB040; --danger:#FF5A5A; --offline:#6B7078;

  --surface:#141519; --surface-2:#1E2025;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
  --text:#F2F4F6; --text-sub:#9BA1A9; --text-mute:#6B7078;

  --fab-bg:rgba(30,32,37,.88); --fab-ic:#F2F4F6;
  --cta-bg:#FFFFFF; --cta-tx:#141519;
  --pin-ring:#141519;

  --map-bg:#16181C; --map-road:#2B2F36; --map-water:#152532;
  --map-park:#1A2620; --map-bld:#1E2126; --map-label:#5A6069;

  --shadow-float:0 2px 10px rgba(0,0,0,.5);
  --shadow-sheet:0 -6px 26px rgba(0,0,0,.55);
  --shadow-pin:0 4px 12px rgba(0,0,0,.7);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#22252b;display:flex;flex-direction:column;
  align-items:center;gap:14px;padding:20px 12px;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ---- デモ用コントロール ---- */
.ctrl{display:flex;gap:6px;background:#2e323a;padding:6px;border-radius:999px}
.ctrl button{border:none;background:none;color:#9aa1ab;font-family:inherit;font-size:12.5px;
  font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.18s}
.ctrl button.on{background:#4D9FFF;color:#fff}
.hint{font-size:11.5px;color:#7b828d;text-align:center;max-width:420px;line-height:1.6}

/* ---- 端末フレーム ---- */
.phone{width:390px;height:844px;background:var(--surface);border-radius:38px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;position:relative;flex-shrink:0;
  transition:background .5s}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;
  font-size:14px;font-weight:600;color:var(--text);pointer-events:none;transition:color .5s}

/* ================= 地図 ================= */
.map{position:absolute;inset:0;background:var(--map-bg);overflow:hidden;transition:background .5s}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map svg *{transition:fill .5s,stroke .5s}

/* ---- アバターピン ---- */
.pin{position:absolute;z-index:20;cursor:pointer;transform:translate(-50%,-100%);
  animation:pop .35s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-100%) scale(.8)}}
.pin .ava{width:54px;height:54px;border-radius:50%;border:3px solid var(--pin-ring);
  box-shadow:var(--shadow-pin);display:grid;place-items:center;
  font-size:21px;font-weight:700;color:#fff;position:relative;transition:border-color .5s}
.pin .ava::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:10px solid var(--pin-ring);transition:border-top-color .5s}
.pin.on  .ava{box-shadow:var(--shadow-pin),0 0 0 3px var(--online)}
.pin.off .ava{box-shadow:var(--shadow-pin),0 0 0 3px var(--offline);filter:saturate(.45)}

.badge{position:absolute;left:50%;transform:translateX(-50%);background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:11px;
  font-weight:600;color:var(--text);box-shadow:var(--shadow-float);white-space:nowrap;
  transition:background .5s,color .5s,border-color .5s}
.badge.top{bottom:calc(100% + 6px)} .badge.bot{top:calc(100% + 12px)}
.badge.g{color:var(--online)} .badge.w{color:var(--warn)} .badge.d{color:var(--danger)}

.me{position:absolute;z-index:15;transform:translate(-50%,-50%)}
.me .dot{width:18px;height:18px;border-radius:50%;background:var(--brand);
  border:3px solid var(--pin-ring);box-shadow:var(--shadow-pin);transition:.5s}
.me .acc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:82px;height:82px;border-radius:50%;background:var(--brand-soft);
  border:1px solid var(--brand);opacity:.5;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.25}}

/* ================= フローティングボタン ================= */
.fabs{position:absolute;z-index:30;display:flex;flex-direction:column;gap:10px}
.fabs.left{left:14px;top:64px} .fabs.right{right:14px;top:64px}
.fab{width:44px;height:44px;border-radius:50%;background:var(--fab-bg);
  border:1px solid var(--border);backdrop-filter:blur(12px);
  box-shadow:var(--shadow-float);display:grid;place-items:center;font-size:19px;
  cursor:pointer;transition:transform .15s,background .5s,border-color .5s;color:var(--fab-ic)}
.fab:active{transform:scale(.92)}
.fab.sos{color:var(--danger);font-size:12px;font-weight:800}

/* ================= ボトムシート ================= */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--border);
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-sheet);
  height:46%;display:flex;flex-direction:column;
  transition:height .3s cubic-bezier(.34,1.3,.64,1),background .5s}
.sheet.big{height:84%}
.handle{padding:10px 0 6px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.handle i{width:36px;height:4px;border-radius:999px;background:var(--text-mute);display:block;opacity:.6}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 12px;flex-shrink:0}
.sh-head h2{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px}
.sh-head h2 em{font-size:12px;color:var(--text-mute);font-style:normal}
.sh-add{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);
  border:1px solid var(--border);color:var(--brand);font-size:19px;cursor:pointer;
  display:grid;place-items:center}
.mlist{flex:1;overflow-y:auto;padding:0 12px 16px}

.mem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;
  cursor:pointer;transition:background .15s}
.mem:active{background:var(--surface-2)}
.mem-av{position:relative;flex-shrink:0}
.mem-av .c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:17px}
.mem-av .odot{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--surface);transition:border-color .5s}
.mem-av .odot.on{background:var(--online);animation:beat 2s infinite}
.mem-av .odot.off{background:var(--offline)}
@keyframes beat{50%{box-shadow:0 0 0 4px rgba(52,217,122,.28)}}
.mem-av .bat{position:absolute;bottom:-2px;right:-4px;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:1px 5px;font-size:9px;font-weight:700}
.bat.g{color:var(--online)} .bat.w{color:var(--warn)} .bat.d{color:var(--danger)}
.mem-b{flex:1;min-width:0}
.mem-n{font-size:15px;font-weight:600;color:var(--text)}
.mem-m{font-size:12px;color:var(--text-sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-m .stale{color:var(--text-mute)}
.mem-c{color:var(--text-mute);font-size:18px;flex-shrink:0}
.mem.self{background:var(--brand-soft)}
.mem.self .mem-n::after{content:'あなた';font-size:10px;font-weight:600;color:var(--brand);
  border:1px solid var(--border-2);padding:1px 6px;border-radius:999px;margin-left:6px;vertical-align:middle}

/* 反転CTA（参考画像の SEND TO MY BMW に相当） */
.cta{margin:4px 12px 14px;padding:15px;border-radius:14px;background:var(--cta-bg);
  color:var(--cta-tx);border:none;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;transition:background .5s,color .5s,transform .15s;flex-shrink:0}
.cta:active{transform:scale(.98)}
</style>
</head>
<body>

<div class="ctrl">
  <button id="bAuto" class="on" onclick="setMode('auto')">🕐 自動（実時刻）</button>
  <button id="bLight" onclick="setMode('light')">☀️ 昼</button>
  <button id="bDark" onclick="setMode('dark')">🌙 夜</button>
</div>
<div class="hint" id="hint"></div>

<div class="phone" id="phone">
  <div class="statusbar"><span id="clock">9:41</span><span>📶 🔋</span></div>

  <div class="map">
    <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
      <rect width="390" height="844" fill="var(--map-bg)"/>
      <rect x="18" y="150" width="120" height="115" rx="10" fill="var(--map-park)"/>
      <rect x="245" y="560" width="135" height="150" rx="10" fill="var(--map-park)"/>
      <path d="M-10 470 Q110 440 195 495 T400 460 L400 520 Q290 560 195 552 T-10 528 Z" fill="var(--map-water)"/>
      <g stroke="var(--map-road)" fill="none" stroke-linecap="round">
        <path d="M0 300 H390" stroke-width="18"/>
        <path d="M0 640 H390" stroke-width="18"/>
        <path d="M95 0 V844" stroke-width="16"/>
        <path d="M275 0 V844" stroke-width="16"/>
        <path d="M0 110 H390" stroke-width="10"/>
        <path d="M0 760 H390" stroke-width="10"/>
        <path d="M185 0 V844" stroke-width="9"/>
        <path d="M345 110 V760" stroke-width="9"/>
        <path d="M30 300 L30 640" stroke-width="7"/>
      </g>
      <g fill="var(--map-bld)">
        <rect x="205" y="130" width="52" height="42" rx="3"/>
        <rect x="205" y="196" width="52" height="70" rx="3"/>
        <rect x="300" y="150" width="34" height="55" rx="3"/>
        <rect x="115" y="330" width="55" height="48" rx="3"/>
        <rect x="115" y="392" width="55" height="42" rx="3"/>
        <rect x="205" y="330" width="58" height="60" rx="3"/>
        <rect x="45" y="672" width="42" height="52" rx="3"/>
        <rect x="115" y="672" width="55" height="52" rx="3"/>
        <rect x="300" y="330" width="36" height="90" rx="3"/>
      </g>
      <g font-family="Noto Sans JP" font-size="9" fill="var(--map-label)">
        <text x="12" y="295">みなと通り</text>
        <text x="12" y="635">さくら大通り</text>
        <text x="100" y="806" transform="rotate(-90 100 806)">中央通り</text>
      </g>
    </svg>

    <div class="me" style="left:186px;top:445px;"><div class="acc"></div><div class="dot"></div></div>

    <div class="pin on" style="left:112px;top:262px;animation-delay:.05s">
      <div class="badge top">こうた</div>
      <div class="ava" style="background:linear-gradient(140deg,#60A5FA,#3B82F6)">こ</div>
      <div class="badge bot g">🔋 82%</div>
    </div>
    <div class="pin on" style="left:295px;top:352px;animation-delay:.15s">
      <div class="badge top">🚗 30km/h</div>
      <div class="ava" style="background:linear-gradient(140deg,#F472B6,#EC4899)">さ</div>
      <div class="badge bot w">🔋 41%</div>
    </div>
    <div class="pin off" style="left:78px;top:700px;animation-delay:.25s">
      <div class="badge top">たけし</div>
      <div class="ava" style="background:linear-gradient(140deg,#A78BFA,#8B5CF6)">た</div>
      <div class="badge bot d">🔋 12%</div>
    </div>
  </div>

  <div class="fabs left">
    <button class="fab">☰</button><button class="fab">⤴</button><button class="fab sos">SOS</button>
  </div>
  <div class="fabs right">
    <button class="fab">◎</button><button class="fab">💬</button><button class="fab">⧉</button>
  </div>

  <div class="sheet" id="sheet">
    <div class="handle" onclick="document.getElementById('sheet').classList.toggle('big')"><i></i></div>
    <div class="sh-head">
      <h2>友だち <em>⌄</em></h2><button class="sh-add">＋</button>
    </div>
    <div class="mlist">
      <div class="mem self">
        <div class="mem-av"><div class="c" style="background:linear-gradient(140deg,#34D399,#10B981)">ゆ</div>
          <div class="odot on"></div><div class="bat g">76</div></div>
        <div class="mem-b"><div class="mem-n">ゆうき</div><div class="mem-m">中央区 · 今</div></div>
        <div class="mem-c">›</div>
      </div>
      <div class="mem">
        <div class="mem-av"><div class="c" style="background:linear-gradient(140deg,#60A5FA,#3B82F6)">こ</div>
          <div class="odot on"></div><div class="bat g">82</div></div>
        <div class="mem-b"><div class="mem-n">こうた 山田</div><div class="mem-m">みなと通り · 今</div></div>
        <div class="mem-c">›</div>
      </div>
      <div class="mem">
        <div class="mem-av"><div class="c" style="background:linear-gradient(140deg,#F472B6,#EC4899)">さ</div>
          <div class="odot on"></div><div class="bat w">41</div></div>
        <div class="mem-b"><div class="mem-n">さくら 佐藤</div><div class="mem-m">🚗 移動中 · 2分前</div></div>
        <div class="mem-c">›</div>
      </div>
      <div class="mem">
        <div class="mem-av"><div class="c" style="background:linear-gradient(140deg,#A78BFA,#8B5CF6)">た</div>
          <div class="odot off"></div><div class="bat d">12</div></div>
        <div class="mem-b"><div class="mem-n">たけし 高橋</div>
          <div class="mem-m"><span class="stale">さくら大通り · 1時間前</span></div></div>
        <div class="mem-c">›</div>
      </div>
      <div class="mem">
        <div class="mem-av"><div class="c" style="background:linear-gradient(140deg,#FBBF24,#F59E0B)">し</div>
          <div class="odot off"></div></div>
        <div class="mem-b"><div class="mem-n">しんじ 中村</div>
          <div class="mem-m"><span class="stale">共有オフ</span></div></div>
        <div class="mem-c">›</div>
      </div>
    </div>
    <button class="cta">帰宅を共有する</button>
  </div>
</div>

<script>
/* ============================================================
   時間連動テーマ
   夜 18:00–5:00 → dark / 昼 5:00–18:00 → light
   ============================================================ */
const NIGHT_START = 18, NIGHT_END = 5;
let mode = 'auto';

function isNight(h){ return h >= NIGHT_START || h < NIGHT_END; }

function apply(){
  const now = new Date();
  const h = now.getHours();
  const theme = mode === 'auto' ? (isNight(h) ? 'dark' : 'light') : mode;
  document.getElementById('phone').dataset.theme = theme;
  document.documentElement.dataset.theme = theme;

  document.getElementById('clock').textContent =
    now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

  const hint = document.getElementById('hint');
  if (mode === 'auto') {
    hint.innerHTML = `現在 <b>${h}時</b> → <b>${theme === 'dark' ? '🌙 夜テーマ' : '☀️ 昼テーマ'}</b>`
      + `<br>夜 18:00〜5:00 は自動でダークに切り替わります（目にやさしく・OLEDの電池を節約）`;
  } else {
    hint.innerHTML = `手動プレビュー中：<b>${theme === 'dark' ? '🌙 夜' : '☀️ 昼'}</b>`;
  }
}

function setMode(m){
  mode = m;
  ['bAuto','bLight','bDark'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById({auto:'bAuto',light:'bLight',dark:'bDark'}[m]).classList.add('on');
  apply();
}

apply();
setInterval(apply, 30000);
</script>
</body>
</html>
