<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimamori — 実地図パステル化テスト</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* ==================================================================
   実地図パステル化テスト
   本物のベクタータイル(CARTO)を読み込み、実行時に色を塗り替えて
   Pokémon Sleep 風パステルにできるかを検証する。
   → GPS・ズーム・世界中どこでも動く「本物の地図」です。
   ================================================================== */
:root{
  --cream:#FBF6E9; --cream-2:#F3EAD6; --ink:#4A4032; --ink-sub:#9A8F7C;
  --mint:#A8D5A2; --sky:#8FC7E8; --coral:#F08C7D;
  --font:'Baloo 2','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#20242b;display:flex;flex-direction:column;
  align-items:center;gap:12px;padding:18px 12px;min-height:100vh}

.bar{display:flex;gap:6px;background:#2d323b;padding:6px;border-radius:999px;flex-wrap:wrap;justify-content:center}
.bar button{border:none;background:none;color:#9aa1ab;font-family:var(--font);font-size:13px;
  font-weight:700;padding:8px 15px;border-radius:999px;cursor:pointer;transition:.18s}
.bar button.on{background:#F0A868;color:#3a2d1e}
.note{font-size:11.5px;color:#828a95;text-align:center;max-width:430px;line-height:1.65}
.note b{color:#c9d1dc}

.phone{width:390px;height:780px;border-radius:36px;overflow:hidden;position:relative;
  box-shadow:0 22px 55px rgba(0,0,0,.5);background:var(--cream);flex-shrink:0}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px !important;opacity:.55}
.maplibregl-ctrl-bottom-left{display:none}

/* ---------- ヘッダー ---------- */
.hdr{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(251,246,233,.95) 40%,rgba(251,246,233,0));
  pointer-events:none}
.hdr h1{font-size:19px;font-weight:800;color:var(--ink);text-shadow:0 1px 0 #fff}
.hdr .btns{display:flex;gap:8px;pointer-events:auto}
.hdr .cbtn{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--cream-2);
  display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(120,100,70,.2);cursor:pointer}

/* ---------- キャラピン ---------- */
.cpin{cursor:pointer;display:flex;flex-direction:column;align-items:center;
  animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.cpin .bub{width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid #fff;
  box-shadow:0 4px 12px rgba(90,75,50,.3);display:grid;place-items:center;position:relative}
.cpin .bub::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #fff;
  filter:drop-shadow(0 2px 1px rgba(90,75,50,.2))}
.cpin .bub svg{width:46px;height:46px}
.cpin .tag{margin-top:11px;background:#fff;border-radius:999px;padding:3px 10px;font-size:11px;
  font-weight:700;color:var(--ink);box-shadow:0 2px 6px rgba(90,75,50,.22);white-space:nowrap}
.cpin.off .bub{filter:grayscale(.65) opacity(.75)}

.mepin{width:20px;height:20px;border-radius:50%;background:#5AA9E6;border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ---------- ボトムシート ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--cream);
  border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(80,65,40,.22);
  padding:8px 0 0;max-height:52%;display:flex;flex-direction:column}
.sheet .hand{width:40px;height:5px;border-radius:99px;background:#DED2B8;margin:2px auto 8px}
.list{overflow-y:auto;padding:0 12px 8px}
.row{display:flex;align-items:center;gap:11px;background:#fff;border-radius:18px;padding:9px 12px;
  margin-bottom:9px;box-shadow:0 2px 5px rgba(120,100,70,.08)}
.row .ic{width:42px;height:42px;border-radius:50%;background:var(--cream-2);display:grid;
  place-items:center;flex-shrink:0}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:700;color:var(--ink)}
.row .mt{font-size:11.5px;color:var(--ink-sub);font-weight:500;margin-top:1px}
.row .bt{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;flex-shrink:0}
.bt .bar2{width:26px;height:11px;border-radius:3px;border:1.5px solid currentColor;padding:1.5px}
.bt .bar2 i{display:block;height:100%;border-radius:1px;background:currentColor}
.g{color:#5BA85F} .w{color:#E0A03C} .d{color:#DD6B5E}

/* ---------- 雲タブバー ---------- */
.tabs{display:flex;justify-content:space-around;align-items:center;padding:6px 8px 12px;
  border-top:1px solid var(--cream-2);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;
  color:var(--ink-sub);cursor:pointer}
.tab .cl{width:48px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:15px}
.tab.on{color:var(--ink)} .tab.on .cl{background:#fff;box-shadow:0 2px 6px rgba(120,100,70,.18)}

.sos{position:absolute;right:14px;top:92px;z-index:11;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(160deg,#FF8A7A,#E85A4F);color:#fff;border:3px solid #fff;
  font-family:var(--font);font-size:12px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 12px rgba(200,70,60,.4)}
</style>
</head>
<body>

<div class="bar">
  <button id="b1" class="on" onclick="setStyle('day')">🌤 パステル昼</button>
  <button id="b2" onclick="setStyle('night')">🌙 パステル夜</button>
  <button id="b3" onclick="setStyle('raw')">⬜ 元の地図（比較）</button>
</div>
<div class="note" id="note"></div>

<div class="phone">
  <div id="map"></div>

  <div class="hdr">
    <h1>Dreamy Family Map</h1>
    <div class="btns"><div class="cbtn">⚙</div><div class="cbtn">＋</div></div>
  </div>

  <button class="sos">SOS</button>

  <div class="sheet">
    <div class="hand"></div>
    <div class="list" id="list"></div>
    <div class="tabs">
      <div class="tab on"><div class="cl">🗺</div>Map</div>
      <div class="tab"><div class="cl">🏠</div>Places</div>
      <div class="tab"><div class="cl">🕐</div>History</div>
      <div class="tab"><div class="cl">⚙</div>Settings</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =========================================================
   1) オリジナル生物キャラ（著作権フリー・自作）
   ========================================================= */
function creature(c1, c2, kind){
  const ear = kind===0 ? `<ellipse cx="26" cy="16" rx="7" ry="11" fill="${c1}"/><ellipse cx="54" cy="16" rx="7" ry="11" fill="${c1}"/>`
            : kind===1 ? `<path d="M22 26 L14 10 L32 18 Z" fill="${c1}"/><path d="M58 26 L66 10 L48 18 Z" fill="${c1}"/>`
            : kind===2 ? `<circle cx="24" cy="18" r="9" fill="${c1}"/><circle cx="56" cy="18" r="9" fill="${c1}"/>`
            : `<path d="M40 8 q10 6 6 16" stroke="${c1}" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="47" cy="10" r="5" fill="${c2}"/>`;
  return `<svg viewBox="0 0 80 80">
    ${ear}
    <ellipse cx="40" cy="48" rx="30" ry="27" fill="${c1}"/>
    <ellipse cx="40" cy="56" rx="21" ry="17" fill="${c2}"/>
    <circle cx="30" cy="43" r="4.5" fill="#3A3228"/><circle cx="50" cy="43" r="4.5" fill="#3A3228"/>
    <circle cx="31.5" cy="41.5" r="1.6" fill="#fff"/><circle cx="51.5" cy="41.5" r="1.6" fill="#fff"/>
    <ellipse cx="21" cy="50" rx="5" ry="3.4" fill="#F5A0A0" opacity=".8"/>
    <ellipse cx="59" cy="50" rx="5" ry="3.4" fill="#F5A0A0" opacity=".8"/>
    <path d="M34 52 q6 6 12 0" stroke="#3A3228" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </svg>`;
}

const MEMBERS = [
  {n:'ママ',   m:'家 · たった今',        b:80, lng:131.4712, lat:34.1806, on:true,  c:['#F2A6C4','#FBD3E2'], k:0},
  {n:'パパ',   m:'職場 · 5分前',         b:60, lng:131.4791, lat:34.1779, on:true,  c:['#8FB8E8','#CDE2F7'], k:2},
  {n:'えみ',   m:'学校 · 1時間前',       b:90, lng:131.4680, lat:34.1752, on:false, c:['#F5D46B','#FBEBB4'], k:3},
  {n:'りく',   m:'公園 · 20分前',        b:25, lng:131.4762, lat:34.1826, on:true,  c:['#9FD9A0','#D5EFD3'], k:1},
];

/* リスト描画 */
document.getElementById('list').innerHTML = MEMBERS.map(p=>{
  const cls = p.b>=50?'g':p.b>=30?'w':'d';
  return `<div class="row">
    <div class="ic">${creature(p.c[0],p.c[1],p.k)}</div>
    <div class="tx"><div class="nm">${p.n}</div><div class="mt">${p.m}</div></div>
    <div class="bt ${cls}"><div class="bar2"><i style="width:${p.b}%"></i></div>${p.b}%</div>
  </div>`;
}).join('');

/* =========================================================
   2) 本物のベクター地図（CARTO・APIキー不要）
   ========================================================= */
const RAW_STYLE = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';

const map = new maplibregl.Map({
  container:'map',
  style: RAW_STYLE,
  center:[131.4737, 34.1789],
  zoom:14.4,
  attributionControl:{compact:true}
});

/* キャラピンを本物の緯度経度に配置 */
MEMBERS.forEach(p=>{
  const el = document.createElement('div');
  el.className = 'cpin' + (p.on?'':' off');
  el.innerHTML = `<div class="bub">${creature(p.c[0],p.c[1],p.k)}</div>
                  <div class="tag">${p.n} · ${p.b}%</div>`;
  new maplibregl.Marker({element:el, anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map);
});
const me = document.createElement('div'); me.className='mepin';
new maplibregl.Marker({element:me}).setLngLat([131.4737,34.1789]).addTo(map);

/* =========================================================
   3) パレット — 実行時に地図レイヤーを塗り替える
   ========================================================= */
const PALETTES = {
  day:{
    land:'#F7F0DC', landuse:'#EFE6CC', water:'#A8D3EE', park:'#BCE0B0', building:'#E5D7B9',
    road:'#FFFFFF', roadCase:'#E6D9BC', label:'#8A7B60', halo:'#FFFFFF'
  },
  night:{
    land:'#2A2F4A', landuse:'#313754', water:'#1B2A47', park:'#263D3A', building:'#3A4166',
    road:'#4A5279', roadCase:'#2F3654', label:'#A9B2D6', halo:'#1C2038'
  }
};

let current = 'day';

function paint(id, prop, val){ try{ map.setPaintProperty(id, prop, val); }catch(e){} }

function applyPalette(name){
  const C = PALETTES[name];
  if(!C) return;
  map.getStyle().layers.forEach(l=>{
    const id = l.id.toLowerCase();
    const sl = (l['source-layer']||'').toLowerCase();
    const t  = l.type;

    if (t === 'background') { paint(l.id,'background-color',C.land); return; }

    const isWater  = id.includes('water') || sl.includes('water') || id.includes('ocean') || id.includes('river');
    const isPark   = id.includes('park')||id.includes('green')||id.includes('wood')||id.includes('grass')||id.includes('landcover')||id.includes('forest');
    const isBld    = id.includes('building') || sl.includes('building');
    const isRoad   = id.includes('road')||id.includes('street')||id.includes('highway')||id.includes('transportation')||id.includes('bridge')||id.includes('tunnel')||sl.includes('transportation');
    const isLand   = id.includes('landuse');
    const isBorder = id.includes('boundary')||id.includes('aeroway');

    if (isWater)      { if(t==='fill') paint(l.id,'fill-color',C.water); if(t==='line') paint(l.id,'line-color',C.water); }
    else if (isPark)  { if(t==='fill') paint(l.id,'fill-color',C.park);  }
    else if (isBld)   { if(t==='fill') { paint(l.id,'fill-color',C.building); paint(l.id,'fill-opacity',.9);} }
    else if (isRoad)  { if(t==='line') paint(l.id,'line-color', id.includes('case')||id.includes('outline')?C.roadCase:C.road); }
    else if (isLand)  { if(t==='fill') paint(l.id,'fill-color',C.landuse); }
    else if (isBorder){ if(t==='line') paint(l.id,'line-color',C.roadCase); }
    else if (t==='fill') { paint(l.id,'fill-color',C.land); }

    if (t === 'symbol'){ paint(l.id,'text-color',C.label); paint(l.id,'text-halo-color',C.halo); paint(l.id,'text-halo-width',1.6); }
  });
  document.querySelector('.phone').style.background = C.land;
  document.body.style.setProperty('--cream', name==='night' ? '#232741' : '#FBF6E9');
}

function setStyle(name){
  ['b1','b2','b3'].forEach(i=>document.getElementById(i).classList.remove('on'));
  document.getElementById({day:'b1',night:'b2',raw:'b3'}[name]).classList.add('on');
  current = name;
  const note = document.getElementById('note');

  if(name === 'raw'){
    map.setStyle(RAW_STYLE);
    note.innerHTML = '<b>元のCARTO Positron地図</b>（無加工）。これが素の状態です。';
  } else {
    map.setStyle(RAW_STYLE);
    map.once('styledata', ()=> applyPalette(name));
    note.innerHTML = name==='day'
      ? '<b>本物のベクター地図</b>をパステルに塗り替え。ズーム・移動・GPS すべて動きます。'
      : '<b>夜パレット</b>。同じ地図データで時間帯だけ切替。';
  }
}

map.on('load', ()=>{
  applyPalette('day');
  document.getElementById('note').innerHTML =
    '<b>本物のベクター地図</b>をパステルに塗り替え。ズーム・移動・GPS すべて動きます。';
});
</script>
</body>
</html>
