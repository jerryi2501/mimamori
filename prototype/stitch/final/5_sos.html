<!-- Bottom Action Area -->
<div class="w-full max-w-md px-6 pb-8 fixed bottom-0 bg-white">
<button class="w-full bg-[#FEE2E2] text-danger font-bold text-[16px] py-4 rounded-full active:bg-[#FCA5A5] transition-colors select-none" id="cancelBtn">
            キャンセル（長押し）
        </button>
<p class="text-center text-muted text-[12px] mt-3">誤って押した場合は長押しで取り消せます</p>
</div>
<script>
        // Simple long press interaction simulation for the button
        const btn = document.getElementById('cancelBtn');
        let pressTimer;
        
        btn.addEventListener('mousedown', startPress);
        btn.addEventListener('touchstart', startPress);
        btn.addEventListener('mouseup', endPress);
        btn.addEventListener('mouseleave', endPress);
        btn.addEventListener('touchend', endPress);

        function startPress(e) {
            e.preventDefault();
            btn.classList.add('bg-[#FCA5A5]', 'scale-95', 'transition-transform');
            pressTimer = window.setTimeout(() => {
                alert('キャンセルしました');
                btn.classList.remove('bg-[#FCA5A5]', 'scale-95');
            }, 1000);
        }

        function endPress(e) {
            clearTimeout(pressTimer);
            btn.classList.remove('bg-[#FCA5A5]', 'scale-95');
        }
    </script>
</body></html>
