<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mimamori - Incoming Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: "#2F6BFF",
                        warning: "#F59E0B",
                        alert: "#EF4444",
                        success: "#22C55E",
                        muted: "#9CA3AF",
                        surface: "#FFFFFF",
                        textMain: "#1A1D26",
                        textSub: "#6B7280"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        label: ["Public Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        .animate-pulse-ring-1 {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .animate-pulse-ring-2 {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            animation-delay: 0.5s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-warning text-surface h-screen w-full flex flex-col justify-between p-6">
<!-- Top Branding -->
<div class="flex justify-center mt-8">
<span class="text-white/60 font-medium tracking-widest text-sm">みまもり</span>
</div>
<!-- Center Content -->
<div class="flex flex-col items-center justify-center flex-grow -mt-10">
<!-- Avatar with Pulsing Rings -->
<div class="relative w-[120px] h-[120px] mb-8 flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border-2 border-white animate-pulse-ring-1"></div>
<div class="absolute inset-0 rounded-full border-2 border-white animate-pulse-ring-2"></div>
<!-- Avatar -->
<img alt="Mother Avatar" class="w-full h-full rounded-full object-cover border-4 border-white relative z-10 shadow-lg" data-alt="A plain, realistic photo portrait of a middle-aged Japanese mother with a gentle expression. The background is simple and unobtrusive. The image is designed to be cropped into a circle for a profile avatar in a family location app. Simple, ordinary, clear lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzEHDMkyLuKUaz1G8YJXB-BDZzAPD3B4UHI7vTzlXLaR6wM9O9EG9yYMg25vFnoRZmQRXCGuz_XOqdbFd9dH-pOZWm3DVPTqdN97HAKnBLSl7VMKBszNjTOhqMXg8rQ5xaibHs2wa1iN_Xpx3GlTjMlyvVy7Sde3W_Sz8VgnhcW-KKv1V5mLE03Kh0M08iLdyxtn2vxrm9p8Kgw6HdD8PjAwcLmF__j8RfqQsJ7C4HyftVAF_l1JtwEYQt4bsZVH1YtUE18kg-jDA"/>
</div>
<!-- Text Content -->
<h1 class="text-[28px] font-bold text-center mb-3">ままが呼んでいます</h1>
<p class="text-[15px] text-white/80 text-center mb-6">大丈夫か知りたがっています</p>
<!-- Status Badge -->
<div class="inline-flex items-center gap-2 bg-white/20 px-4 py-1.5 rounded-full backdrop-blur-sm">
<span class="material-symbols-outlined text-[18px]">notifications_active</span>
<span class="text-sm font-medium">音が鳴っています</span>
</div>
</div>
<!-- Bottom Actions -->
<div class="flex flex-col gap-4 w-full max-w-sm mx-auto pb-8">
<!-- Primary Action -->
<button class="w-full h-[68px] bg-white text-warning text-[20px] font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-warning" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            大丈夫だよ
        </button>
<!-- Secondary Action -->
<button class="w-full py-4 text-white/70 text-[15px] font-medium active:text-white transition-colors">
            あとで返す
        </button>
<!-- Footer Notice -->
<p class="text-center text-white/50 text-xs mt-4">
            タップすると、ままに「大丈夫」と位置情報が届きます
        </p>
</div>
</body></html>
