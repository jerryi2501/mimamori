<script>
        // Simple toggle interaction for demonstration
        document.querySelectorAll('button[role="switch"]').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const isChecked = this.getAttribute('aria-checked') === 'true';
                this.setAttribute('aria-checked', !isChecked);
                
                const span = this.querySelector('span');
                const label = this.previousElementSibling;
                
                if (!isChecked) {
                    this.classList.remove('bg-gray-200');
                    this.classList.add('bg-brand');
                    span.classList.remove('translate-x-0');
                    span.classList.add('translate-x-5');
                    if(label) label.textContent = '位置共有：オン';
                } else {
                    this.classList.remove('bg-brand');
                    this.classList.add('bg-gray-200');
                    span.classList.remove('translate-x-5');
                    span.classList.add('translate-x-0');
                    if(label) label.textContent = '位置共有：オフ';
                }
            });
        });
        
        // Format input code
        const codeInput = document.querySelector('input[type="text"]');
        if(codeInput) {
            codeInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                if (value.length > 3) {
                    value = value.slice(0, 3) + '-' + value.slice(3, 6);
                }
                e.target.value = value;
            });
        }
    </script>
