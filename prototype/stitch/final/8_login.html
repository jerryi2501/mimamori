<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>みまもり - ログイン</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: '#2F6BFF',
                        surface: '#FFFFFF',
                        background: '#F5F7FA',
                        textPrimary: '#1A1D26',
                        textSecondary: '#6B7280',
                        textMuted: '#9CA3AF',
                        border: '#E5E7EB',
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        lg: "1rem",
                        xl: "1.5rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        label: ["Public Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface font-body text-textPrimary h-screen flex flex-col items-center justify-center p-6">
<div class="w-full max-w-sm flex flex-col gap-8">
<!-- UPPER AREA -->
<div class="flex flex-col items-center text-center gap-4">
<img alt="みまもり アプリアイコン" class="w-[72px] h-[72px] rounded-2xl shadow-sm object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAsfnczvFEr7Wh9pipOCTYV_10eq8tOwCD3qIs_EXLRqXfCtTZJTCHkljfihwBYXFz2YNWDTYmujlaMJqK9cJEFLDkLp1cEL9uUqVBuMLDV0Gd8FAGQ4v2I17AKAmGYB_0GeAH7Q7nICrCYsWGx58H-cH8kFgwMCwtcc1_OX6l1Gr7PrmTZmq1C1SKbG2tNf9thck52xa_T5s-yFmmbAOLk6dmdbCyrYvQQw5DS3-8lMppmcLtK_Sg84gaQcwDjIuKZOUhFMDiOd4"/>
<div class="flex flex-col gap-1">
<h1 class="text-[26px] font-bold font-headline text-textPrimary leading-tight">みまもり</h1>
<p class="text-[14px] text-textSecondary font-medium">家族の「今どこ？」を、そっと見守る</p>
</div>
</div>
<!-- FORM -->
<form class="flex flex-col gap-5 w-full">
<div class="flex flex-col gap-2">
<label class="text-[13px] font-semibold text-textPrimary" for="email">メールアドレス</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-textMuted text-[20px]">mail</span>
<input class="w-full h-12 pl-11 pr-4 border border-border rounded-xl focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-[15px] placeholder-textMuted" id="email" placeholder="example@mail.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-[13px] font-semibold text-textPrimary" for="password">パスワード</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-textMuted text-[20px]">lock</span>
<input class="w-full h-12 pl-11 pr-11 border border-border rounded-xl focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-[15px] tracking-widest text-textPrimary" id="password" type="password" value="••••••••"/>
<button class="absolute right-4 flex items-center justify-center text-textMuted hover:text-textSecondary" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-[13px] text-primary hover:underline font-medium" href="#">パスワードを忘れた方</a>
</div>
</div>
<button class="w-full h-[52px] bg-primary text-surface font-bold text-[16px] rounded-xl flex items-center justify-center shadow-sm hover:opacity-90 transition-opacity mt-2" type="submit">
                ログイン
            </button>
</form>
<!-- OR SECTION -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-border flex-1"></div>
<span class="text-[13px] text-textMuted font-medium">または</span>
<div class="h-px bg-border flex-1"></div>
</div>
<!-- SOCIAL LOGIN -->
<button class="w-full h-12 bg-surface border border-border rounded-xl flex items-center justify-center gap-3 hover:bg-background transition-colors shadow-sm" type="button">
<!-- Google Icon SVG placeholder -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-[15px] font-semibold text-textPrimary">Googleで続ける</span>
</button>
<!-- BOTTOM -->
<div class="flex flex-col items-center gap-6 mt-4">
<p class="text-[14px] text-textSecondary font-medium">
                アカウントをお持ちでない方は <a class="text-primary hover:underline" href="#">新規登録</a>
</p>
<p class="text-[11px] text-textMuted text-center max-w-[280px] leading-relaxed">
                続行することで、利用規約とプライバシーポリシーに同意したものとみなされます
            </p>
</div>
</div>
</body></html>
